<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Automation Analysis')}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container mt-4 border border-box rounded p-3">

    <div>

        <button type="button" id="analyzeBtn" class="btn btn-primary">
            Analyze
        </button>

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">Automation Analysis</h1>
                <p class="text-muted mb-0">
                    Review the actions before executing them.
                </p>
            </div>

            <button
                    type="button"
                    id="executeBtn"
                    class="btn btn-success px-4"
                    disabled>
                APPROVE & EXECUTE
            </button>
        </div>
    </div>


    <!-- Summary -->
    <div id="summarySection" class="mb-4 d-none border border-box rounded">

        <div class="card">

            <div class="card-body">

                <h5 class="card-title">
                    Analysis Summary
                </h5>

                <p id="summaryText"
                   class="mb-0 text-muted">
                </p>

            </div>

        </div>

    </div>

    <!-- Quartet -->
    <div id="quartetSection" class="mb-4 d-none">

        <h4 class="mb-3">Quartet</h4>

        <div class="card">

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-3">
                        <label class="form-label text-muted">
                            Compound
                        </label>

                        <div id="quartetCompound"
                             class="fw-semibold">
                        </div>
                    </div>


                    <div class="col-md-3">
                        <label class="form-label text-muted">
                            Study
                        </label>

                        <div id="quartetStudy"
                             class="fw-semibold">
                        </div>
                    </div>


                    <div class="col-md-3">
                        <label class="form-label text-muted">
                            Department
                        </label>

                        <div id="quartetDepartment"
                             class="fw-semibold">
                        </div>
                    </div>


                    <div class="col-md-3">
                        <label class="form-label text-muted">
                            Partner
                        </label>

                        <div id="quartetPartner"
                             class="fw-semibold">
                        </div>
                    </div>

                </div>


                <hr>


                <div class="d-flex align-items-center gap-3">

                    <span class="text-muted">
                        Database Status:
                    </span>

                    <span id="quartetStatus"
                          class="badge">
                    </span>

                </div>

            </div>

        </div>

    </div>

    <!-- Users -->
    <div id="usersSection" class="mb-4 d-none">

        <h4 class="mb-3">Users</h4>

        <div class="table-responsive">

            <table class="table table-bordered align-middle">

                <thead class="table-light">

                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Database Status</th>
                    <th>Action</th>
                    <th>Notification</th>
                    <th>SFTP Credentials</th>
                </tr>

                </thead>

                <tbody id="usersTableBody">
                </tbody>

            </table>

        </div>

    </div>

    <!-- Exchange -->
    <div id="exchangeSection" class="mb-4 d-none">

        <h4 class="mb-3">Exchange</h4>

        <div class="card">

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label text-muted">
                            Source Endpoint
                        </label>

                        <div id="sourceEndpoint"
                             class="fw-semibold">
                        </div>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label text-muted">
                            Destination Endpoint
                        </label>

                        <div id="destinationEndpoint"
                             class="fw-semibold">
                        </div>

                    </div>

                </div>


                <hr>


                <div class="d-flex align-items-center gap-3">

                    <span class="text-muted">
                        Database Status:
                    </span>

                    <span id="exchangeStatus"
                          class="badge">
                    </span>

                </div>

            </div>

        </div>

    </div>

    <!-- Execution Steps -->
    <div id="stepsSection" class="mb-5 d-none">

        <h4 class="mb-3">
            Execution Plan
        </h4>


        <div id="stepsContainer">
        </div>

    </div>

</div>


<!-- Result Modal -->
<div class="modal fade"
     id="responseModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Automation
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body"
                 id="responseModalBody">
            </div>

        </div>

    </div>

</div>


<th:block th:replace="~{fragments/script :: script}"></th:block>
<script th:src="@{/js/executionPlan.js}"></script>

</body>
</html>
